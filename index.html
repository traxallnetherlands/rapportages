function supplierPptTable(sl,a,mo,y){const rows=[[cell('Leverancier',{bold:true,color:'FFFFFF',fill:'213153'}),...mo.map(m=>cell(M[m],{bold:true,color:'FFFFFF',fill:'213153',align:'center'}))],[cell('Prolongatiekosten',{align:'center'}),...mo.map(m=>cell(euro(a[m].t),{align:'center'}))],[cell('Aantal voertuigen',{align:'center'}),...mo.map(m=>cell(num.format(a[m].c),{align:'center'}))],[cell('Gemiddeld per voertuig',{align:'center'}),...mo.map(m=>cell(euro(a[m].a),{align:'center'}))]];sl.addTable(rows,{x:.62,y,w:12.05,h:1.05,border:{type:'solid',color:'D8D9DD',pt:.5},fontFace:'Century Gothic',fontSize:7.5,margin:.025,rowH:.21,colW:[1.65,...mo.map(()=>10.4/mo.length)]})}
function invoiceRows(c,mo){const types=Object.values(TM).sort((a,b)=>a[1]-b[1]).filter(t=>c.some(x=>x.type===t[0]));return types.map(t=>{const r=c.filter(x=>x.type===t[0]),spec=[...new Map(r.map(x=>[n(x.prod),{n:x.prod,o:x.po}])).values()].sort((a,b)=>a.o-b.o),rows=spec.map(s=>[s.n,...mo.map(m=>sum(r,x=>x.m===m&&n(x.prod)===n(s.n)))]);rows.push(['Subtotaal '+t[0],...mo.map(m=>sum(r,x=>x.m===m))]);return{name:t[0],rows}})}
function addInvoiceOverview(p,logo,c){const sl=brandSlide(p,logo);addTitle(sl,'Gefactureerde kosten alle leveranciers');const mo=months(c),groups=invoiceRows(c,mo);const totalUnits=groups.reduce((a,g)=>a+g.rows.length+1,0),available=5.65,gap=.055,rowH=Math.min(.185,(available-gap*(groups.length-1))/totalUnits);let y=1.28;groups.forEach(g=>{const header=[cell(g.name,{bold:true,color:'FFFFFF',fill:'213153',fontSize:6.5}),...mo.map(m=>cell(M[m],{bold:true,color:'FFFFFF',fill:'213153',align:'center',fontSize:6.5}))],body=g.rows.map((r,i)=>r.map((v,j)=>cell(j===0?v:euro(v),{fontSize:6.5,bold:i===g.rows.length-1,color:i===g.rows.length-1?'FFFFFF':'213153',fill:i===g.rows.length-1?'F6931C':(i%2?'F7F7F8':'FFFFFF'),align:'center'}))),rows=[header,...body],h=rows.length*rowH;sl.addTable(rows,{x:1.0,y,w:11.33,h,border:{type:'solid',color:'D8D9DD',pt:.3},fontFace:'Century Gothic',fontSize:6.5,margin:.01,rowH,colW:[2.05,...mo.map(()=>9.28/mo.length)],autoFit:false});y+=h+gap})}
async function makePpt(){if(!reportState){status.textContent='Maak eerst de rapportage.';return}ppt.disabled=true;status.textContent='PowerPoint wordt opgebouwd...';try{await document.fonts.ready;charts.forEach(c=>c.resize());await new Promise(r=>setTimeout(r,300));const {c,mo,client,cy}=reportState,P=new PptxGenJS(),logo=await logoAsset();pptTheme(P);const cover=P.addSlide();cover.background={color:'FFFFFF'};const coverLogo=fitLogo(logo,4.75,.75,3.85,1.35);if(coverLogo)cover.addImage(coverLogo);cover.addText('TraXall Kostenrapportage',{x:1,y:3.0,w:11.33,h:.55,fontFace:'Century Gothic',fontSize:28,bold:true,color:'213153',align:'center',margin:0});cover.addText(client,{x:1,y:3.76,w:11.33,h:.45,fontFace:'Century Gothic',fontSize:22,bold:true,color:'3E3E40',align:'center',margin:0});cover.addText(cy,{x:1,y:4.32,w:11.33,h:.4,fontFace:'Century Gothic',fontSize:20,color:'F6931C',align:'center',margin:0});addChartImageSlide(P,logo,document.querySelector('#tot').closest('.section').querySelector('h2').textContent,'tot',client+' | '+cy);addChartImageSlide(P,logo,'Totale kosten per kostensoort','types',client+' | '+cy);addChartImageSlide(P,logo,'Aantal geprolongeerde voertuigen','veh',client+' | '+cy);addChartImageSlide(P,logo,'Gemiddelde prolongatiekosten en aantal leasevoertuigen (alle leveranciers)','all',client+' | '+cy);const suppliers=[...new Set(c.filter(x=>n(x.prod)==='leasetarief').map(x=>x.sup))].sort();suppliers.forEach((s,i)=>addChartImageSlide(P,logo,'Gemiddelde prolongatiekosten ('+s+')','s'+i,client+' | '+cy,lm(c,s),mo));addInvoiceOverview(P,logo,c);await P.writeFile({fileName:'TraXall_Kostenrapportage_'+cy+'.pptx'});status.textContent='Bewerkbare PowerPoint is gegenereerd.'}catch(e){console.error(e);status.textContent='PowerPoint-export mislukt: '+e.message}finally{ppt.disabled=false}}
prev.onchange=()=>pn.textContent=prev.files[0]?.name||'Geen bestand';cur.onchange=()=>cn.textContent=cur.files[0]?.name||'Geen bestand';document.getElementById('run').onclick=run;document.getElementById('ppt').onclick=makePpt;</script></body></html>
